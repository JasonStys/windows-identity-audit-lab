name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Identity evidence / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-15-intel, python: '3.14'}
    env:
      PYTHONPATH: .
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov=identitylab --cov-report=term-missing:skip-covered
      - run: python scripts/code_map.py --check
      - run: python scripts/file_guide.py --check
      - run: python scripts/validate_repo.py
      - run: python scripts/evaluate.py
      - run: python scripts/benchmark.py
  windows:
    name: Windows native collector + PowerShell analysis
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python scripts/pssa.py
      - shell: pwsh
        run: ./powershell/Test-Identity.ps1 -Native -AnalyzerPath ./.tools/pssa-1.25.0/PSScriptAnalyzer.psd1
      - shell: pwsh
        run: ./powershell/Collect-Identity.ps1 -Authorized -HostAlias DISPOSABLE-RUNNER -OutputPath .tools/native-snapshot.json
      - run: python scripts/native_contract.py
  security:
    name: Locked graph + secrets + workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
      - run: python scripts/scanners.py gitleaks
      - run: python scripts/scanners.py actionlint
      - run: .tools/gitleaks git . --redact --no-banner
      - run: .tools/actionlint
